org.gradle.jvmargs=-Xmx1G

# Kept in lockstep with the BBS build this addon compiles against. A mismatch breaks the dev
# environment in ways that look like anything but a mismatch, so copy these from BBS's own
# gradle.properties rather than from the Fabric website.
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.16.14
fabric_version=0.92.1+1.20.1

# The BBS build to compile against, as published by `gradlew publishToMavenLocal` in BBS.
# BBS's version is `mod_version + "-" + minecraft_version`.
bbs_version=2.7-1.20.1

mod_version=1.2.0
maven_group=bbslod
archives_base_name=bbs-lezy
