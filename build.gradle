plugins {
	id 'fabric-loom' version '1.15-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	/* BBS is published here by `gradlew publishToMavenLocal` in the BBS repository. There is no
	 * public repository for it. */
	mavenLocal()
	mavenCentral()
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}

	/* Sodium lives on Modrinth's maven; the exclusiveContent filter keeps the repository from
	 * being consulted for anything else. Same shape as BBS's own build file. */
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	/* Sodium so the dev client matches a real setup: BBS's sodium mixins apply, and the form
	 * render path goes through the sodium vertex pipeline. Iris is still excluded — add
	 * maven.modrinth:iris:1.7.0+1.20.1 the same way if shader rendering needs exercising. */
	modImplementation "maven.modrinth:sodium:mc1.21.1-0.6.13-fabric"
	modRuntimeOnly "maven.modrinth:iris:1.8.8+1.21.1-fabric"
	runtimeOnly "org.anarres:jcpp:1.4.14"
	runtimeOnly "io.github.douira:glsl-transformer:2.0.0-pre13"

	/* transitive = false keeps BBS's own Iris and glsl-transformer out of this build; Sodium is
	 * declared above instead so the dev client runs with it. */
	modImplementation("mchorse:bbs:${project.bbs_version}") { transitive = false }

	// NVIDIA PhysX 5 JNI bindings (mode physics DestructionBox — fase D1).
	// Native windows + linux ikut; jar include natives taruh dalam mod jar.
	implementation "de.fabmax:physx-jni:2.7.1"
	runtimeOnly "de.fabmax:physx-jni:2.7.1:natives-windows"
	runtimeOnly "de.fabmax:physx-jni:2.7.1:natives-linux"
	include "de.fabmax:physx-jni:2.7.1"
	include "de.fabmax:physx-jni:2.7.1:natives-windows"
	include "de.fabmax:physx-jni:2.7.1:natives-linux"

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

/* Windows Java can fail to connect its selector's Unix-domain socket in the user temp
 * directory (PipeImpl: Invalid argument: connect), which kills runClient. Same guard as
 * BBS's own build file: keep those short-lived sockets local to this checkout, which also
 * covers the integrated server the client starts. */
tasks.named('runClient', JavaExec) {
	useXvfb = false

	def displacedJars = []

	/* Exclude all extra/Prism mods from run/mods/ so runClient boots cleanly with essential mods only (BBS, Sodium, Iris, etc.) from Loom dependencies */
	doFirst {
		def prismModsDir = project.file('run/prism-mods')
		prismModsDir.mkdirs()
		fileTree('run/mods').matching {
			include '*.jar'
		}.each { file ->
			def target = new File(prismModsDir, file.name)
			file.renameTo(target)
			displacedJars.add(file.name)
			logger.lifecycle("Moved ${file.name} to run/prism-mods/ for runClient isolation.")
		}
	}

	doLast {
		def prismModsDir = project.file('run/prism-mods')
		def modsDir = project.file('run/mods')
		displacedJars.each { fileName ->
			def source = new File(prismModsDir, fileName)
			if (source.exists()) {
				def target = new File(modsDir, fileName)
				source.renameTo(target)
				logger.lifecycle("Restored ${fileName} back to run/mods/ after runClient.")
			}
		}
	}

	if (System.getProperty('os.name').startsWith('Windows')) {
		def socketDir = layout.projectDirectory.dir('.gradle/sockets').asFile
		systemProperty 'jdk.net.unixdomain.tmpdir', socketDir.absolutePath
		doFirst {
			socketDir.mkdirs()
		}
	}
}

/* Loom caches the remapped BBS by its Maven coordinates, and BBS's version does not change while
 * it is being worked on — so a rebuilt BBS is silently ignored, and it looks exactly like the
 * changes to BBS not existing. A flag one has to remember is a flag one forgets, so this notices
 * on its own: if the published jar is newer than the cached remap, the cache goes. */
def bbsJar = new File(new File(System.getProperty("user.home")), ".m2/repository/mchorse/bbs/${project.bbs_version}/bbs-${project.bbs_version}.jar")
def remapCache = file(".gradle/loom-cache/remapped_mods/remapped/mchorse")

if (bbsJar.exists() && remapCache.exists() && bbsJar.lastModified() > remapCache.lastModified()) {
	logger.lifecycle("BBS was rebuilt since it was last remapped — clearing ${remapCache}")
	delete(remapCache)
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

/* Stage Prism launcher mods into run/mods/ for headless mc-runtime-test runs */
tasks.register('stagePrismMods') {
	doLast {
		def prismModsDir = project.file('run/prism-mods')
		def modsDir = project.file('run/mods')
		modsDir.mkdirs()
		if (prismModsDir.exists()) {
			fileTree(prismModsDir).matching {
				include '*.jar'
			}.each { file ->
				def target = new File(modsDir, file.name)
				java.nio.file.Files.copy(file.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			}
			logger.lifecycle("Staged Prism mods from run/prism-mods/ into run/mods/ for mc-runtime-test.")
		}
	}
}

/* Unstage / move all jars out of run/mods/ into run/prism-mods/ */
tasks.register('unstagePrismMods') {
	doLast {
		def prismModsDir = project.file('run/prism-mods')
		prismModsDir.mkdirs()
		fileTree('run/mods').matching {
			include '*.jar'
		}.each { file ->
			def target = new File(prismModsDir, file.name)
			file.renameTo(target)
		}
		logger.lifecycle("Unstaged all jars from run/mods/ to run/prism-mods/.")
	}
}
