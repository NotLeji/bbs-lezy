# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.
#
# Hasil build bisa di-download dari tab Actions (artifacts) tanpa perlu
# build di laptop. BBS di-install dari vendor/ karena cuma ada di mavenLocal.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: install BBS ke Maven Local (dari vendor/)
        run: |
          BBS_DIR=~/.m2/repository/mchorse/bbs/2.7-1.20.1
          mkdir -p "$BBS_DIR"
          cp vendor/bbs-2.7-1.20.1.jar vendor/bbs-2.7-1.20.1.pom "$BBS_DIR/"
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
